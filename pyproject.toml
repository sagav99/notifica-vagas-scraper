[project]
name = "notifica-vagas-scraper"
version = "0.1.0"
description = "Coleta de vagas de concurso público (SP/MG) para o Notifica Vagas"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
