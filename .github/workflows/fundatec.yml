name: Fundatec (editais do bucket público, RS/SC/PR)

# Pedido do usuário (2026-10-28): monitorar a Fundatec de forma automática,
# sem depender de navegador nem do notebook ligado. O site é bloqueado por
# WAF, mas o bucket S3 de editais é público e listável (ver
# `fontes/fundatec.py`). Leitura do texto do edital é local (sem IA); Gemini
# só em edital de prefeitura com cargo médico e município sem vaga médica
# aberta (teto de 6 chamadas por execução). Dias úteis, 09:30 UTC: livre
# entre `historico-sul` (08:00) e `diarios-sul` (12:10). Grupo
# `gemini-pesado`: um workflow Gemini por vez.

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: gemini-pesado
  cancel-in-progress: false

jobs:
  fundatec:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest tests/test_fundatec.py

      - name: Fundatec
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ORIGEM: fundatec
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/rodar_fundatec.py --dias 45 --ultimos 80 --max-gemini 6
