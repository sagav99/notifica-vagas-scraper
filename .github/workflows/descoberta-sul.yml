name: Descoberta Sul (Serper PR/SC/RS, ter/qui)

# Pedido do usuário (2026-10-26): usar os dias em que MG/SP não rodam (a
# descoberta ampla roda seg/qua/sex) para monitorar o Sul. Mesmo pipeline
# (Serper -> casar município -> Gemini -> revisão), só com consultas por
# estado. Orçamento: 3 créditos x 2 dias = 6/semana, compensados pelas 2
# consultas de menor rendimento retiradas das de MG/SP (30 créditos/semana
# no total, igual a antes). Mesmo horário da descoberta ampla; sem conflito
# de dia, e a trava de Gemini vale de qualquer forma.

on:
  schedule:
    - cron: "45 23 * * 2,4"
  workflow_dispatch: {}

concurrency:
  group: gemini-pesado
  cancel-in-progress: false

jobs:
  descobrir-sul:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      - name: Descoberta Sul (Serper)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY_DESCOBERTA_GOOGLE: ${{ secrets.GEMINI_API_KEY_DESCOBERTA_GOOGLE }}
          GEMINI_ORIGEM: descoberta-sul
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/rodar_descoberta_google_search.py --regiao sul
