name: Completude de vaga médica via Gemini (busca real, automático)

# Substitui o uso normal de completude_codex.py (pausado pelo usuário,
# 2026-09-18: cota da assinatura ChatGPT esgotando rápido) — usa a API
# do Gemini com as tools nativas google_search+url_context (busca real
# na internet e leitura de página) pra completar campo faltando e
# conferir se a vaga é mesmo concurso/PSS de emprego, não residência
# médica/fellowship (achado real, edital da Santa Casa de BH).
#
# Compartilha a cota diária do Gemini com scrape-diario.yml/
# revisar-vagas.yml/descoberta-ampla.yml/backfill-print-evidencias.yml
# (quota_gemini.proximo_modelo(), mesmo par padrão/fallback) — horário
# isolado (2h UTC) pra nunca rodar ao mesmo tempo de outro workflow
# Gemini-pesado (ver CLAUDE.md do repo principal): depois do backfill de
# print (00h30 UTC, timeout 60min) e bem antes da coleta diária (21h UTC).
# Lote pequeno por execução (ver TAMANHO_LOTE em scripts/completude_gemini.py)
# — não é loop contínuo como o Codex era, roda 1x/dia e para.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

# Trava global: no máximo 1 workflow pesado de Gemini por vez (RPM/TPM são
# por processo, não compartilhados — decisão do usuário, 2026-10-02). Se um
# atrasar e invadir o horário do próximo, o seguinte ESPERA na fila em vez de
# rodar junto. Horários (UTC) espaçados com folga (>= 1h entre o fim esperado
# de um e o início do próximo): 15:00 auditar, 17:30 instar, 21:00 coleta
# diária, 23:45 descoberta, 00:45 revisar, 02:00 backfill, 04:00 completude,
# 06:00 datas extras.
concurrency:
  group: gemini-pesado
  cancel-in-progress: false

jobs:
  completude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      - name: Completude + conferência de natureza via Gemini
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/completude_gemini.py
