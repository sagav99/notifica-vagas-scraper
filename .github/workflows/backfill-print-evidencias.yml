name: Backfill de print de evidência antiga (Gemini, limitado)

# Achado #E da análise de produto de 2026-09-10 (repo principal): a UI de
# print/link direto pra página do PDF (2026-09-09) só grava
# `pagina_pdf`/`url_print_pagina` em vaga nova — o backlog anterior a
# essa data (3153 evidências em 2026-09-10) cai no fallback genérico
# "Abrir fonte". Decisão do usuário: começar o backfill, priorizando
# vaga mais atual, gastando pouca cota de Gemini (busca de texto sem IA
# primeiro via `busca_pagina_pdf.py`, IA só como fallback capado — ver
# `scripts/backfill_print_evidencias.py`). Workflow isolado, cadência
# diária, timeout curto — não deve competir por tempo/cota com a coleta
# nem a revisão automática (mesmo motivo já documentado em
# scrape-diario.yml/revisar-vagas.yml).

on:
  schedule:
    - cron: "30 1 * * *" # depois da coleta (21h UTC) e da revisão (23h UTC) — 18h Brasília, 2026-09-12
  workflow_dispatch: {}

# Trava global: no máximo 1 workflow pesado de Gemini por vez (RPM/TPM são
# por processo, não compartilhados — decisão do usuário, 2026-10-02). Se um
# atrasar e invadir o horário do próximo, o seguinte ESPERA na fila em vez de
# rodar junto. Horários (UTC) espaçados com folga: 15:00 auditar, 17:30
# instar, 21:00 coleta diária, 23:30 descoberta, 00:15 revisar, 01:30 backfill,
# 03:30 completude.
concurrency:
  group: gemini-pesado
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      - name: Backfill de print de evidência antiga
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/backfill_print_evidencias.py
