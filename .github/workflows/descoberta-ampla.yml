name: Descoberta ampla (PCI, Google News, Serper)

# Extraído de scrape-diario.yml em 2026-09-16 — mesmo padrão de
# revisar-vagas.yml (extraído em 2026-09-08). As 3 etapas de "Descoberta
# ampla" (PCI Concursos, Google News RSS, Serper/Vigia) rodavam como
# últimos passos de scrape-diario.yml e disputavam o mesmo
# timeout-minutes com as ~17 fontes oficiais que rodam antes delas.
# Achado em produção: nas execuções de 14 e 15/09/2026 a coleta das
# fontes oficiais sozinha já estourou os 75min (job morto por SIGTERM,
# exit 143, no meio de uma fonte comum) — a Serper nunca chegou a ser
# chamada em nenhum dos 2 dias, mesmo com chave/cota disponíveis.
# Workflow isolado com timeout próprio garante que a descoberta ampla
# sempre roda, independente de quanto a coleta oficial do dia levou.

on:
  schedule:
    # 19h Brasília (UTC-3) = 22h UTC, ~1h depois da coleta diária —
    # evita 2 workflows Gemini-pesados disputando GEMINI_API_KEY ao
    # mesmo tempo. Só dias úteis (decisão do usuário, 2026-09-16): fonte
    # oficial não publica edital novo em fim de semana.
    - cron: "45 23 * * 1-5"
  workflow_dispatch:
    inputs:
      google_search_backfill:
        description: "Executa a descoberta Serper em modo backfill retroativo (usar --janela pra escolher o estágio)"
        required: false
        default: false
        type: boolean
      google_search_janela:
        description: "Só com backfill=true: estágio de recência do backfill"
        required: false
        default: "tudo"
        type: choice
        options:
          - semana
          - mes
          - trimestre
          - tudo

# Trava global: no máximo 1 workflow pesado de Gemini por vez (RPM/TPM são
# por processo, não compartilhados — decisão do usuário, 2026-10-02). Se um
# atrasar e invadir o horário do próximo, o seguinte ESPERA na fila em vez de
# rodar junto. Horários (UTC) espaçados com folga (>= 1h entre o fim esperado
# de um e o início do próximo): 15:00 auditar, 17:30 instar, 21:00 coleta
# diária, 23:45 descoberta, 00:45 revisar, 02:00 backfill, 04:00 completude,
# 06:00 datas extras.
concurrency:
  group: gemini-pesado
  cancel-in-progress: false

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      - name: Descoberta ampla (PCI Concursos — radar, não coleta)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/descobrir_pci.py

      - name: Descoberta ampla (Google News RSS — concurso médico)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_descoberta_google_news.py

      - name: Descoberta ampla (Serper — concurso médico)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY_DESCOBERTA_GOOGLE: ${{ secrets.GEMINI_API_KEY_DESCOBERTA_GOOGLE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/rodar_descoberta_google_search.py ${{ inputs.google_search_backfill && format('--backfill --janela {0}', inputs.google_search_janela) || '' }}
