name: Revisar vagas pendentes (Gemini, automático)

# Extraído de scrape-diario.yml/scrape-instar.yml em 2026-09-08. Antes a
# revisão rodava como último passo de cada workflow de coleta e disputava
# tempo com ela dentro do mesmo timeout-minutes — resultado real (achado
# em produção nesta data): o job inteiro vinha sendo morto por SIGTERM
# (exit 143) no meio da revisão em pelo menos 3 execuções diárias
# seguidas (06, 07, 08/09/2026), então nenhuma vaga nova ficava
# aprovada/rejeitada nesses dias, mesmo com a coleta em si tendo
# funcionado. Workflow isolado com timeout bem folgado garante que a
# revisão sempre tem uma janela cheia pra esvaziar a fila pendente,
# independente de quanto a coleta do dia (ou da Instar) levou.

on:
  schedule:
    - cron: "45 0 * * *" # ~2h depois do início da coleta diária (21h UTC = 18h Brasília, 2026-09-12)
  workflow_dispatch: {}

# Trava global: no máximo 1 workflow pesado de Gemini por vez (RPM/TPM são
# por processo, não compartilhados — decisão do usuário, 2026-10-02). Se um
# atrasar e invadir o horário do próximo, o seguinte ESPERA na fila em vez de
# rodar junto. Horários (UTC) espaçados com folga (>= 1h entre o fim esperado
# de um e o início do próximo): 15:00 auditar, 17:30 instar, 21:00 coleta
# diária, 23:45 descoberta, 00:45 revisar, 02:00 backfill, 04:00 completude,
# 06:00 datas extras.
concurrency:
  group: gemini-pesado
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      - name: Revisar vagas pendentes (Gemini, automático)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/revisar_vagas.py

      # 2ª passada (decisão do usuário, 2026-09-11, achado da auditoria de
      # revisão): reavalia vaga cuja decisão diverge da maioria de irmãs do
      # mesmo edital, com o consenso delas como contexto extra — corrige o
      # não-determinismo da 1ª passada sem reprocessar tudo em lote. `if:
      # always()` pra rodar mesmo se o passo acima tiver parado cedo por
      # cota esgotada (mesmo padrão já usado no resto do projeto).
      - name: Verificar consistência da revisão entre vagas irmãs
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/verificar_consistencia_revisao.py
