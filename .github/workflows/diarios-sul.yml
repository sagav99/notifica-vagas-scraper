name: Diários oficiais do Sul (SC CIGA, PR AMP, RS FAMURS)

# Monitor determinístico dos diários oficiais municipais agregadores
# (investigação 2026-10-28: docs/investigacao_diarios_oficiais_sul_2026-10-28.md
# no repo principal). Filtro de abertura com cargo médico em código; Gemini só
# nos poucos candidatos (teto 10 por UF por execução = até 30/dia, tipicamente
# ~5). 0 Serper. Dias úteis ~12:10 UTC (09:10 BRT), entre o histórico do Sul
# (08:00) e a auditoria (15:00); janela de 3 dias cobre o fim de semana.

on:
  schedule:
    - cron: "43 11 * * 1-5"   # fora do horário nobre do GitHub (o das 12:10 chegou a rodar 6 h depois)
  workflow_dispatch:
    inputs:
      dias:
        description: "Janela em dias (padrão 3; backfill inicial: 14)"
        default: "3"
      max_gemini:
        description: "Teto de chamadas Gemini por UF"
        default: "10"
      ufs:
        description: "UFs a rodar (padrão: SC PR RS)"
        default: "SC PR RS"

# Trava global: no máximo 1 workflow pesado de Gemini por vez.
concurrency:
  group: gemini-pesado
  cancel-in-progress: false

jobs:
  diarios-sul:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      - name: Diários do Sul (SC)
        if: ${{ always() && contains(inputs.ufs || 'SC PR RS', 'SC') }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ORIGEM: diarios-sul
        run: python scripts/rodar_diarios_sul.py --uf SC --dias "${{ inputs.dias || '3' }}" --max-gemini "${{ inputs.max_gemini || '10' }}"

      - name: Diários do Sul (PR)
        if: ${{ always() && contains(inputs.ufs || 'SC PR RS', 'PR') }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ORIGEM: diarios-sul
        run: python scripts/rodar_diarios_sul.py --uf PR --dias "${{ inputs.dias || '3' }}" --max-gemini "${{ inputs.max_gemini || '10' }}"

      - name: Diários do Sul (RS)
        if: ${{ always() && contains(inputs.ufs || 'SC PR RS', 'RS') }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ORIGEM: diarios-sul
        run: python scripts/rodar_diarios_sul.py --uf RS --dias "${{ inputs.dias || '3' }}" --max-gemini "${{ inputs.max_gemini || '10' }}"
