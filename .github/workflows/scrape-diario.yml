name: Coleta de vagas (diário — todas menos Instar)

# Dividido de scrape.yml em 2026-09-05 (decisão do usuário, registrada em
# TAREFAS.md do repo principal): Instar sozinha consome muito mais cota do
# Gemini (231 municípios) que o resto das fontes somadas, então ela ficou
# isolada em scrape-instar.yml (cadência de 3 em 3 dias) enquanto as
# demais ~17 fontes, com volume bem menor, passam a rodar todo dia aqui.
#
# A revisão automática do Gemini (antes rodava como último passo deste
# workflow) foi extraída pra revisar-vagas.yml em 2026-09-08: ela vinha
# fazendo o job inteiro estourar o timeout-minutes e ser morto no meio da
# revisão (achado em produção, 3 execuções seguidas 06-08/09/2026) — ver
# comentário em revisar-vagas.yml.
#
# As 3 etapas de "Descoberta ampla" (PCI, Google News RSS, Serper) foram
# extraídas pra descoberta-ampla.yml em 2026-09-16, mesmo motivo: nas
# execuções de 14 e 15/09/2026 a coleta das fontes oficiais abaixo já
# estourou sozinha os 75min, matando o job antes de a Serper rodar. O
# commit 5bbdbd2 (16/09) atualizou só o cron/workflow_dispatch mas
# esqueceu de remover os 3 steps duplicados no fim deste arquivo — rodaram
# em dobro (aqui e em descoberta-ampla.yml) até serem removidos daqui em
# 2026-09-19, achado só nessa data por não haver alerta de duplicidade.

on:
  schedule:
    # 18h horário de Brasília (UTC-3, sem horário de verão) = 21h UTC —
    # decisão do usuário, 2026-09-12 (antes rodava 06h UTC/03h Brasília).
    # Só dias úteis (decisão do usuário, 2026-09-16): fonte oficial não
    # publica edital novo em fim de semana.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  coletar:
    runs-on: ubuntu-latest
    # 90min (aumentado de 75min em 2026-09-19, mitigação imediata — causa
    # raiz de qual fonte trava ainda não investigada): job já foi
    # cancelado por estourar o timeout sem deixar nenhum rastro no banco
    # (ver step "Registrar timeout/cancelamento" no fim do job). 75min
    # era: 30min de base (checkout/deps/testes + fontes de volume baixo)
    # + ~30min pra DOM/AMM-MG em busca automática por entidade (161
    # municípios x 2 termos, ~1,5s entre buscas) + folga. Não inclui mais
    # revisão automática (ver revisar-vagas.yml) nem Instar (maior
    # consumidora de tempo/cota, isolada em scrape-instar.yml).
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      - name: Rodar coleta (DOM/AMM-MG)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_dom_amm_mg_busca.py

      - name: Rodar coleta (APM/SP)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_apm_sp_busca.py

      - name: Rodar coleta (IMESO)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_imeso.py

      - name: Rodar coleta (FGV)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_fgv.py

      - name: Rodar coleta (Actcon)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_actcon.py

      - name: Rodar coleta (WordPress)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_wordpress.py

      - name: Rodar coleta (IMAM)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_imam.py

      - name: Rodar coleta (JCM Concursos)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_jcm.py

      - name: Rodar coleta (ACCESS)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_access.py

      - name: Rodar coleta (Ache Concursos)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_ache_concursos.py

      - name: Rodar coleta (Avança SP)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_avancasp.py

      - name: Rodar coleta (FUNDEP)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_fundep.py

      - name: Rodar coleta (IBGP)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_ibgp.py

      - name: Rodar coleta (MSConcursos)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_msconcursos.py

      - name: Rodar coleta (INEPAM)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_inepam.py

      - name: Rodar coleta (Kingpage)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_kingpage.py

      - name: Rodar coleta (PBH/IBFC)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_pbh_ibfc.py

      - name: Rodar coleta (Instituto Mais)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_instituto_mais.py

      - name: Rodar coleta (Prefeitura de Itamonte/MG)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_itamonte_mg.py

      - name: Rodar coleta (Instituto Nosso Rumo)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_nosso_rumo.py

      - name: Rodar coleta (IBAM-SP)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_ibamsp.py

      - name: Rodar coleta (Mauá/SP — Processo Seletivo Saúde)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_maua.py

      - name: Rodar coleta (Prefeitura de João Monlevade/MG)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_pmjm_mg.py

      - name: Rodar coleta (Prefeitura de Bocaiúva/MG)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_bocaiuva_mg.py

      - name: Rodar coleta (Prefeitura de Guiricema/MG)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_guiricema.py

      - name: Rodar coleta (Prefeitura de Sorocaba/SP)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # sem GEMINI_API_KEY: extração de cargo/salário 100% determinística
        # (pdfplumber.extract_tables()), ver fontes/sorocaba_sp.py.
        run: python scripts/rodar_sorocaba.py

      - name: Rodar coleta (Instituto Consulplan)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_institutoconsulplan.py

      - name: Rodar coleta (Prefeitura de São Sebastião do Oeste/MG)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # sem GEMINI_API_KEY: extração de cargo/salário 100% determinística
        # (pdfplumber.extract_tables()), ver fontes/sao_sebastiao_do_oeste_mg.py.
        run: python scripts/rodar_sao_sebastiao_do_oeste_mg.py

      - name: Registrar timeout/cancelamento em execucoes_scraper
        # Só roda quando o job inteiro foi cancelado (timeout-minutes
        # estourado, ou cancelamento manual) ou falhou de um jeito que
        # nenhum passo individual chegou a capturar via
        # db.rastrear_execucao — sem isso, essa falha só existia no
        # histórico de runs do GitHub Actions (expira, não é
        # consultável). `if: always()` não seria certo aqui: cada
        # `rodar_*.py` já grava seu próprio sucesso/falha, então rodar
        # sempre duplicaria uma linha extra a cada execução normal.
        if: failure() || cancelled()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/registrar_execucao_interrompida.py scrape-diario.yml "${{ job.status }}"
