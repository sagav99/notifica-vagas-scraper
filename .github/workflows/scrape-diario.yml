          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_bocaiuva_mg.py

      - name: Rodar coleta (Prefeitura de Guiricema/MG)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_guiricema.py

      - name: Rodar coleta (Prefeitura de Sorocaba/SP)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # sem GEMINI_API_KEY: extração de cargo/salário 100% determinística
        # (pdfplumber.extract_tables()), ver fontes/sorocaba_sp.py.
        run: python scripts/rodar_sorocaba.py

      - name: Rodar coleta (Instituto Consulplan)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_institutoconsulplan.py

      - name: Descoberta ampla (PCI Concursos — radar, não coleta)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/descobrir_pci.py

      - name: Descoberta ampla (Google News RSS — concurso médico)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_descoberta_google_news.py

      - name: Descoberta ampla (Serper — concurso médico)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          GEMINI_API_KEY_DESCOBERTA_GOOGLE: ${{ secrets.GEMINI_API_KEY_DESCOBERTA_GOOGLE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/rodar_descoberta_google_search.py ${{ inputs.google_search_backfill && format('--backfill --janela {0}', inputs.google_search_janela) || '' }}
