      - name: Rodar coleta (Instituto Mais)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_instituto_mais.py

      - name: Rodar coleta (Prefeitura de Itamonte/MG)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_itamonte_mg.py

      - name: Rodar coleta (Instituto Nosso Rumo)
        if: always()
        env:
