name: Coleta de vagas

on:
  schedule:
    # A cada 3 dias, 06:00 UTC. Cron não tem "a cada N dias" de verdade —
    # isso é "todo dia-do-mês múltiplo de 3", então o intervalo pode
    # encurtar na virada do mês (ex: dia 31 -> dia 1). Aceitável pro
    # cadência-alvo do projeto (ver CLAUDE.md).
    - cron: "0 6 */3 * *"
  workflow_dispatch: {}

jobs:
  coletar:
    runs-on: ubuntu-latest
    # 30min -> 60min ao somar o step Instar (230 municípios) + revisão
    # automática (pode envolver bastante chamada ao Gemini com rate limit
    # de 4,5s cada); 60min -> 90min ao trocar DOM/AMM-MG pra busca
    # automática por entidade (161 municípios x 2 termos, ~1,5s entre
    # buscas, sem Gemini nesta etapa — mas ainda soma tempo real) —
    # commit por item/entidade torna seguro cortar no meio.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Rodar testes
        run: pytest

      - name: Rodar coleta (DOM/AMM-MG)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_dom_amm_mg_busca.py

      - name: Rodar coleta (APM/SP)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_apm_sp_busca.py

      - name: Rodar coleta (IMESO)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/rodar_imeso.py

      - name: Rodar coleta (FGV)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_fgv.py

      - name: Rodar coleta (Instar)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_instar.py

      - name: Rodar coleta (Actcon)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_actcon.py

      - name: Rodar coleta (WordPress)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_wordpress.py

      - name: Rodar coleta (IMAM)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/rodar_imam.py

      - name: Revisar vagas pendentes (Gemini, automático)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/revisar_vagas.py
