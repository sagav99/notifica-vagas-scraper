name: Postar vaga do dia no Instagram

# 1 post por dia útil (19h30 Brasília, decisão do usuário 2026-10-05). Não usa Gemini (legenda é template),
# então não conflita com a regra de 1 workflow Gemini-pesado por vez.
# Ver docs/roadmap_instagram_diario.md no repo notifica-vagas.

on:
  schedule:
    - cron: "30 22 * * 1-5" # 19h30 Brasília (22h30 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só gerar card e legenda (não publica)"
        type: boolean
        default: true
      vaga_id:
        description: "Opcional: id da vaga a postar (em vez de sortear)"
        type: string
        default: ""

permissions:
  contents: write # sobe o PNG na branch instagram-cards

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -e ".[dev,instagram]"
          playwright install --with-deps chromium

      - name: Rodar testes
        run: pytest tests/test_instagram_*.py

      - name: Gerar card e (se não for dry-run) publicar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIVULGACAO_SECRET: ${{ secrets.DIVULGACAO_SECRET }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_REMETENTE_EMAIL: ${{ secrets.BREVO_REMETENTE_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          VAGA_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.vaga_id || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          if [ -n "$VAGA_ID" ]; then ARGS="--vaga-id $VAGA_ID"; fi
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/postar_instagram.py --dry-run $ARGS
          else
            python scripts/postar_instagram.py $ARGS
          fi

      - name: Guardar card gerado (dry-run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-instagram
          path: saida_instagram/
          if-no-files-found: ignore
